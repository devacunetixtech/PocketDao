name: Deploy PocketDAO contracts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mainnet
    defaults:
      run:
        working-directory: contracts
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
      BOTCHAIN_MAINNET_RPC_URL: https://rpc.botchain.ai
      BOTCHAIN_MAINNET_VERIFIER_URL: https://scan.botchain.ai/api/
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check deployment secrets
        run: |
          test -n "$PRIVATE_KEY" || (echo "PRIVATE_KEY secret is missing" && exit 1)
          test -n "$BLOCKSCOUT_API_KEY" || (echo "BLOCKSCOUT_API_KEY secret is missing" && exit 1)
          [[ "$PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]] || (echo "PRIVATE_KEY must be 0x followed by 64 hexadecimal characters" && exit 1)
      - name: Install contract dependencies
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run contract tests
        run: forge test -vvv
      - name: Deploy and verify
        run: |
          forge script script/DeployBotchain.s.sol:DeployBotchain \
            --rpc-url "$BOTCHAIN_MAINNET_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$BOTCHAIN_MAINNET_VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow

      - name: Publish mainnet factory address to the app
        working-directory: .
        run: |
          FACTORY_ADDRESS=$(jq -r '.transactions[] | select(.contractName == "PocketDAOFactory") | .contractAddress' contracts/broadcast/DeployBotchain.s.sol/677/run-latest.json | head -n 1)
          [[ "$FACTORY_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || (echo "Could not read the deployed factory address" && exit 1)

          printf 'import type { Address } from "viem";\n\n// Updated automatically by the verified mainnet deployment workflow.\nexport const mainnetFactoryAddress = "%s" as Address;\n' "$FACTORY_ADDRESS" > lib/deployments.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deployments.ts
          git commit -m "chore: publish BOT Chain mainnet deployment"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "### PocketDAO mainnet deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Factory: [$FACTORY_ADDRESS](https://scan.botchain.ai/address/$FACTORY_ADDRESS)" >> "$GITHUB_STEP_SUMMARY"
