name: Deploy PocketDAO contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: BOT Chain network
        required: true
        type: choice
        options:
          - testnet
          - mainnet

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    defaults:
      run:
        working-directory: contracts
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
      BOTCHAIN_TESTNET_RPC_URL: https://rpc.bohr.life
      BOTCHAIN_MAINNET_RPC_URL: https://rpc.botchain.ai
      BOTCHAIN_TESTNET_VERIFIER_URL: https://scan.bohr.life/api/
      BOTCHAIN_MAINNET_VERIFIER_URL: https://scan.botchain.ai/api/
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check deployment secrets
        run: |
          test -n "$PRIVATE_KEY" || (echo "PRIVATE_KEY secret is missing" && exit 1)
          test -n "$BLOCKSCOUT_API_KEY" || (echo "BLOCKSCOUT_API_KEY secret is missing" && exit 1)
      - name: Install contract dependencies
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run contract tests
        run: forge test -vvv
      - name: Deploy and verify
        run: |
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            RPC_URL="$BOTCHAIN_MAINNET_RPC_URL"
            VERIFIER_URL="$BOTCHAIN_MAINNET_VERIFIER_URL"
          else
            RPC_URL="$BOTCHAIN_TESTNET_RPC_URL"
            VERIFIER_URL="$BOTCHAIN_TESTNET_VERIFIER_URL"
          fi

          forge script script/DeployBotchain.s.sol:DeployBotchain \
            --rpc-url "$RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow
