[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
botchain_testnet = "${BOTCHAIN_TESTNET_RPC_URL}"
botchain_mainnet = "${BOTCHAIN_MAINNET_RPC_URL}"

[etherscan]
botchain_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "${BOTCHAIN_TESTNET_VERIFIER_URL}", chain = 968 }
botchain_mainnet = { key = "${BLOCKSCOUT_API_KEY}", url = "${BOTCHAIN_MAINNET_VERIFIER_URL}", chain = 677 }
